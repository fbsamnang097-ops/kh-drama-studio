name: Build apps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows,   os: windows-latest, exe: kh-drama-studio,         ext: ".exe", sep: ";", arch: "" }
          - { target: mac-intel, os: macos-15-intel, exe: KH-Drama-Studio-mac-intel, ext: "",     sep: ":", arch: intel }
          - { target: mac-arm,   os: macos-15,       exe: KH-Drama-Studio-mac-arm64, ext: "",     sep: ":", arch: arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(tr -d ' \r\n' < VERSION)" = "${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm install
          npm run build

      - name: FFmpeg (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          Copy-Item ffx/*/bin/ffmpeg.exe bin/
          Copy-Item ffx/*/bin/ffprobe.exe bin/

      - name: FFmpeg (macOS)
        if: startsWith(matrix.target, 'mac')
        shell: bash
        run: |
          mkdir -p bin
          for t in ffmpeg ffprobe; do
            curl -fL -A "Mozilla/5.0" -o "$t.zip" "https://www.osxexperts.net/${t}80${{ matrix.arch }}.zip"
            unzip -o "$t.zip" -d bin
          done
          chmod +x bin/ffmpeg bin/ffprobe
          bin/ffmpeg -version | head -1
          bin/ffprobe -version | head -1

      - name: Build app
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pyinstaller --onefile --name "${{ matrix.exe }}" \
            --add-data "frontend/dist${{ matrix.sep }}frontend/dist" \
            --add-data "VERSION${{ matrix.sep }}." \
            --add-binary "bin/ffmpeg${{ matrix.ext }}${{ matrix.sep }}bin" \
            --add-binary "bin/ffprobe${{ matrix.ext }}${{ matrix.sep }}bin" \
            --collect-submodules backend \
            --collect-submodules uvicorn \
            launcher.py

      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.exe }}${{ matrix.ext }} --check

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp "dist/${{ matrix.exe }}.exe" out/
          else
            chmod +x "dist/${{ matrix.exe }}"
            (cd dist && zip -j "../out/${{ matrix.exe }}.zip" "${{ matrix.exe }}")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
