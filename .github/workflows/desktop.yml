name: Build desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows,   os: windows-latest }
          - { name: mac-arm,   os: macos-15 }
          - { name: mac-intel, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          test "v$V" = "$GITHUB_REF_NAME"
          test "$(node -p "require('./package.json').version")" = "$V"

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Node dependencies
        run: npm install

      - name: Collect FFmpeg
        run: |
          mkdir -p bin
          npm install --no-save ffmpeg-static ffprobe-static
          node -e "const fs=require('fs');const x=process.platform==='win32'?'.exe':'';fs.copyFileSync(require('ffmpeg-static'),'bin/ffmpeg'+x);fs.copyFileSync(require('ffprobe-static').path,'bin/ffprobe'+x)"
          chmod +x bin/* || true
          ls -la bin

      - name: Build backend (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          pyinstaller --noconfirm --onedir --name kh-server --distpath dist-backend \
            --add-data "frontend/dist${SEP}frontend/dist" \
            --add-data "VERSION${SEP}." \
            --collect-submodules backend \
            --collect-submodules uvicorn \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all tokenizers \
            --collect-all av \
            --collect-all onnxruntime \
            --hidden-import faster_whisper \
            launcher.py

      - name: Smoke test backend
        run: |
          EXE=./dist-backend/kh-server/kh-server
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=$EXE.exe; fi
          PATH="$PWD/bin:$PATH" $EXE --port 8731 --no-browser > backend.log 2>&1 &
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8731/api/version; then ok=1; break; fi
            sleep 1
          done
          echo
          if [ "$ok" != "1" ]; then cat backend.log; exit 1; fi
          PATH="$PWD/bin:$PATH" ffmpeg -version | head -1
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM kh-server.exe //T || true; else pkill -f kh-server || true; fi

      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
