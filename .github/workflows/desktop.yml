name: Build desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built installers to the GitHub release for the version in VERSION"
        type: boolean
        default: false
      require_mac_arm:
        description: "Block the release until the Apple Silicon (arm64) installer is built"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows,   os: windows-latest,  optional: false }
          - { name: mac-intel, os: macos-15-intel,  optional: false }
          # Runner macOS ARM64 របស់ GitHub ខ្វះ capacity៖ job ដែលរង់ចាំ runner មិនបាន
          # ត្រូវបានលុបចោលក្រោយ ~១៥ នាទី ("The job was not acquired by Runner of type
          # hosted")។ សាកល្បង image ARM64 គ្រប់ម៉ូដែលក្នុងពេលតែមួយ ដើម្បីឱ្យមួយណាមួយ
          # អាចចាប់ build បាន ហើយកុំឱ្យ pool ដែលគ្មាន runner បរាជ័យ run ទាំងមូល។
          - { name: mac-arm,    os: macos-15, optional: true }
          - { name: mac-arm-14, os: macos-14, optional: true }
          - { name: mac-arm-26, os: macos-26, optional: true }
    runs-on: ${{ matrix.os }}
    # optional: true សម្រាប់តែជើង ARM៖ Windows និង Mac Intel ត្រូវតែជោគជ័យ។
    continue-on-error: ${{ matrix.optional }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          test "v$V" = "$GITHUB_REF_NAME"
          test "$(node -p "require('./package.json').version")" = "$V"

      - name: Build and smoke-test frontend mount
        run: |
          cd frontend
          npm ci
          npm run check:ui-mount

      - name: Install Node dependencies
        run: npm install

      - name: Collect FFmpeg
        run: |
          mkdir -p bin
          npm install --no-save ffmpeg-static ffprobe-static
          node -e "const fs=require('fs');const x=process.platform==='win32'?'.exe':'';fs.copyFileSync(require('ffmpeg-static'),'bin/ffmpeg'+x);fs.copyFileSync(require('ffprobe-static').path,'bin/ffprobe'+x)"
          chmod +x bin/* || true
          ls -la bin

      - name: Build backend (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip list | grep -i -E "^(av|faster|ctranslate2)" || pip list | findstr /i "av faster ctranslate2"
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          pyinstaller --noconfirm --onedir --name kh-server --distpath dist-backend \
            --add-data "frontend/dist${SEP}frontend/dist" \
            --add-data "VERSION${SEP}." \
            --collect-submodules backend \
            --collect-submodules uvicorn \
            --collect-data certifi \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all tokenizers \
            --collect-all av \
            --collect-all onnxruntime \
            --hidden-import faster_whisper \
            --collect-all demucs \
            --collect-all torchaudio \
            --collect-all julius \
            --collect-all openunmix \
            --collect-all einops \
            --collect-all lameenc \
            --hidden-import demucs.separate \
            --collect-all soundfile \
            --hidden-import soundfile \
            launcher.py

      - name: Smoke test backend
        run: |
          EXE=./dist-backend/kh-server/kh-server
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=$EXE.exe; fi
          PATH="$PWD/bin:$PATH" $EXE --port 8731 --no-browser > backend.log 2>&1 &
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8731/api/version; then ok=1; break; fi
            sleep 1
          done
          echo
          if [ "$ok" != "1" ]; then cat backend.log; exit 1; fi
          PATH="$PWD/bin:$PATH" ffmpeg -version | head -1
          # Ensure the packaged EXE serves both the tagged backend version and the current frontend.
          python scripts/check_packaged_ui.py http://127.0.0.1:8731
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM kh-server.exe //T || true; else pkill -f kh-server || true; fi

      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify UI inside the actual installer payload
        run: python scripts/check_installer_payload.py release

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  release:
    needs: build
    # មិនដែល publish release មិនគ្រប់គ្រាន់ទេ៖ គ្រប់ platform ត្រូវតែ build និង upload ជោគជ័យ។
    # always() ពីព្រោះជើង ARM ដែលរង់ចាំ runner មិនបាន ត្រូវ GitHub cancel ទោះជា optional ក៏ដោយ។
    if: ${{ always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(tr -d ' \r\n' < VERSION)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Verify complete cross-platform release assets
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          test -s "out/KH-Drama-Studio-v${V}.exe" || { echo "::error::Windows installer missing"; exit 1; }
          test -s "out/KH-Drama-Studio-v${V}-x64.dmg" || { echo "::error::Mac Intel installer missing"; exit 1; }
          test -s out/latest.yml || { echo "::error::latest.yml missing"; exit 1; }
          if [ -s "out/KH-Drama-Studio-v${V}-arm64.dmg" ]; then
            printf 'RELEASE_ASSETS_OK v%s: Windows + Mac Intel + Mac ARM\n' "$V"
            exit 0
          fi
          if [ "${{ inputs.require_mac_arm }}" = "false" ]; then
            echo "::warning::Apple Silicon installer missing - publishing Windows + Mac Intel only."
            {
              echo "### គ្មាន installer Apple Silicon (arm64)"
              echo "គ្រប់ image ARM64 (macos-15, macos-14, macos-26) មិនអាចចាប់ runner បានទេ (GitHub capacity)។"
              echo "កំណែ x64 ដំណើរការលើ Apple Silicon តាមរយៈ Rosetta។ សូម re-run workflow នេះនៅពេល runner មាន។"
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'RELEASE_ASSETS_PARTIAL v%s: Windows + Mac Intel\n' "$V"
            exit 0
          fi
          echo "::error::Apple Silicon (arm64) installer missing: no macOS arm64 runner was available. Re-run this workflow, or run it with require_mac_arm=false to publish Windows + Mac Intel only."
          exit 1

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: KH Drama Studio v${{ steps.version.outputs.version }}
          make_latest: true
          files: out/*
          generate_release_notes: false
          body: |
            ## អ្វីថ្មី
            - កែសម្រួលកាលវិភាគសំឡេងតួអង្គ និងអក្សរខ្មែរ ឱ្យត្រូវគ្នានៅ Preview, Timeline និងវីដេអូ Export។
            - កែការផ្គូផ្គងឃ្លា និងតួអង្គ ដើម្បីឱ្យសំឡេងនីមួយៗនៅជាមួយអត្ថបទ និងតួអង្គដើមរបស់វា។
            - ពេលបកប្រែ ឬប្តូរតួអង្គ សំឡេង TTS ចាស់នឹងត្រូវដកចេញ ដើម្បីអាចបង្កើតសំឡេងថ្មីត្រឹមត្រូវ។

            ## ទាញយក
            [ទំព័រទាញយកសម្រាប់ Windows និង Mac](https://github.com/fbsamnang097-ops/kh-drama-studio/releases/tag/v${{ steps.version.outputs.version }})
            ${{ inputs.require_mac_arm == 'false' && '> ចំណាំ៖ កំណែនេះមិនទាន់មាន installer Apple Silicon (arm64) ទេ ព្រោះ GitHub មិនមាន macOS ARM runner ទំនេរ។ សូមប្រើកំណែ x64 (ដំណើរការលើ Apple Silicon តាមរយៈ Rosetta)។' || '' }}
