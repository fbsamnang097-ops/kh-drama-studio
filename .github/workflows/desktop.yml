name: Build desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "ជ្រើស platform សម្រាប់ build ដោយដៃ"
        type: choice
        required: true
        default: mac-arm
        options:
          - mac-arm
          - windows
          - mac-intel
          - all

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows,   os: windows-latest }
          # ប្រើ runner ARM64 macOS 15 ដែលបានសាកល្បង build installer រួច។
          - { name: mac-arm,   os: macos-15 }
          - { name: mac-intel, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          test "v$V" = "$GITHUB_REF_NAME"
          test "$(node -p "require('./package.json').version")" = "$V"

      - name: Build and smoke-test frontend mount
        run: |
          cd frontend
          npm ci
          npm run check:ui-mount

      - name: Install Node dependencies
        run: npm install

      - name: Collect FFmpeg
        run: |
          mkdir -p bin
          npm install --no-save ffmpeg-static ffprobe-static
          node -e "const fs=require('fs');const x=process.platform==='win32'?'.exe':'';fs.copyFileSync(require('ffmpeg-static'),'bin/ffmpeg'+x);fs.copyFileSync(require('ffprobe-static').path,'bin/ffprobe'+x)"
          chmod +x bin/* || true
          ls -la bin

      - name: Build backend (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip list | grep -i -E "^(av|faster|ctranslate2)" || pip list | findstr /i "av faster ctranslate2"
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          pyinstaller --noconfirm --onedir --name kh-server --distpath dist-backend \
            --add-data "frontend/dist${SEP}frontend/dist" \
            --add-data "VERSION${SEP}." \
            --collect-submodules backend \
            --collect-submodules uvicorn \
            --collect-data certifi \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all tokenizers \
            --collect-all av \
            --collect-all onnxruntime \
            --hidden-import faster_whisper \
            --collect-all demucs \
            --collect-all torchaudio \
            --collect-all julius \
            --collect-all openunmix \
            --collect-all einops \
            --collect-all lameenc \
            --hidden-import demucs.separate \
            --collect-all soundfile \
            --hidden-import soundfile \
            launcher.py

      - name: Smoke test backend
        run: |
          EXE=./dist-backend/kh-server/kh-server
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=$EXE.exe; fi
          PATH="$PWD/bin:$PATH" $EXE --port 8731 --no-browser > backend.log 2>&1 &
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8731/api/version; then ok=1; break; fi
            sleep 1
          done
          echo
          if [ "$ok" != "1" ]; then cat backend.log; exit 1; fi
          PATH="$PWD/bin:$PATH" ffmpeg -version | head -1
          # Ensure the packaged EXE serves both the tagged backend version and the current frontend.
          python scripts/check_packaged_ui.py http://127.0.0.1:8731
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM kh-server.exe //T || true; else pkill -f kh-server || true; fi

      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify UI inside the actual installer payload
        run: python scripts/check_installer_payload.py release

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  release:
    needs: build
    # Never publish a partial release: every matrix platform must build and upload successfully.
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Verify complete cross-platform release assets
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          test -s "out/KH-Drama-Studio-v${V}.exe"
          test -s "out/KH-Drama-Studio-v${V}-x64.dmg"
          test -s "out/KH-Drama-Studio-v${V}-arm64.dmg"
          test -s out/latest.yml
          printf 'RELEASE_ASSETS_OK v%s: Windows + Mac Intel + Mac ARM\n' "$V"
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: false
          body: |
            ## អ្វីថ្មី
            - កែសម្រួលកាលវិភាគសំឡេងតួអង្គ និងអក្សរខ្មែរ ឱ្យត្រូវគ្នានៅ Preview, Timeline និងវីដេអូ Export។
            - កែការផ្គូផ្គងឃ្លា និងតួអង្គ ដើម្បីឱ្យសំឡេងនីមួយៗនៅជាមួយអត្ថបទ និងតួអង្គដើមរបស់វា។
            - ពេលបកប្រែ ឬប្តូរតួអង្គ សំឡេង TTS ចាស់នឹងត្រូវដកចេញ ដើម្បីអាចបង្កើតសំឡេងថ្មីត្រឹមត្រូវ។

            ## ទាញយក
            [ទំព័រទាញយកសម្រាប់ Windows និង Mac](https://github.com/fbsamnang097-ops/kh-drama-studio/releases/tag/${{ github.ref_name }})
