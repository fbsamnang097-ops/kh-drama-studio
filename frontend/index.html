<style>body{font-family:'Noto Sans Khmer','Noto Sans SC',sans-serif;color:#f4f1ff;height:100vh;overflow:hidden;

(function(){

  var P=[["#ec4899","#a855f7"],["#fb923c","#fbbf24"],["#22d3ee","#3b82f6"],["#34d399","#a3e635"],["#a78bfa","#f472b6"],["#fb7185","#fbbf24"]];

<script id="kh-box-js">
(function(){
  var RX=/^(export|\u1793\u17b6\u17c6\u1785\u17c1\u1789|\u1791\u17c6\u17a0\u17c6|\u1785\u17d2\u1794\u17b6\u179f\u17cb|resolution|quality|size)/i;
  var P=[["#ec4899","#a855f7"],["#22d3ee","#3b82f6"],["#fbbf24","#fb923c"],["#34d399","#a3e635"]];
  var n=0;
  function isBox(e){
    var c=getComputedStyle(e), r=parseFloat(c.borderTopLeftRadius)||0;
    var bg=c.backgroundColor, hasBg=bg&&bg!=="rgba(0, 0, 0, 0)"&&bg!=="transparent";
    var hasBd=(parseFloat(c.borderTopWidth)||0)>0;
    return r>=8&&(hasBg||hasBd||c.backgroundImage!=="none");
  }
  function boxOf(el){
    var e=el.parentElement,k=0;
    while(e&&e!==document.body&&k<6){
      if(e.id==="root") return null;
      if(isBox(e)){
        var w=e.getBoundingClientRect();
        if(w.width<innerWidth*0.95&&w.height<innerHeight*0.9&&!e.closest("nav,header,footer,#kh-foot,#kh-poster")) return e;
      }
      e=e.parentElement;k++;
    }
    return null;
  }
  function mark(b){
    if(!b||b.classList.contains("kh-fb")) return;
    var p=P[n++%P.length];
    b.style.setProperty("--b1",p[0]); b.style.setProperty("--b2",p[1]);
    if(getComputedStyle(b).position==="static") b.classList.add("kh-fb-rel");
    b.classList.add("kh-fb");
  }
  function run(){
    try{
      document.querySelectorAll(".kh-szg").forEach(function(g){mark(boxOf(g));});
      document.querySelectorAll("div,span,h1,h2,h3,h4,b,strong").forEach(function(e){
        if(e.children.length||e.closest("nav,header,footer,button,label,#kh-foot,#kh-poster")) return;
        var t=(e.textContent||"").trim();
        if(t.length>0&&t.length<=30&&RX.test(t)) mark(boxOf(e));
      });
    }catch(x){}
  }
  new MutationObserver(run).observe(document.getElementById("root"),{childList:true,subtree:true});
  run();
})();
</script>

<script id="kh-pf-js">
(function(){
  var DEF=[
    {rx:/Subtitles/i, c:["#ec4899","#a855f7"]},
    {rx:/Add Text/i, c:["#22d3ee","#3b82f6"]},
    {rx:/^Export Video$/i, c:["#34d399","#fbbf24"]}
  ];
  var items=[], pending=false;
  function findBtn(rx){
    var list=document.querySelectorAll("button,label,a");
    for(var i=0;i<list.length;i++){
      var e=list[i]; if(e.closest("#kh-foot,#kh-poster")) continue;
      if(rx.test((e.textContent||"").trim())) return e;
    }
    return null;
  }
  function panelOf(a,others){
    var e=a.parentElement,best=null,last=null;
    while(e&&e!==document.body&&e.id!=="root"){
      if(others.some(function(o){return o&&e.contains(o);})) break;
      var r=parseFloat(getComputedStyle(e).borderTopLeftRadius)||0;
      if(r>=8) best=e;
      last=e; e=e.parentElement;
    }
    return best||last;
  }
  function build(){
    var anchors=DEF.map(function(d){return findBtn(d.rx);});
    DEF.forEach(function(d,i){
      var a=anchors[i]; if(!a) return;
      var el=panelOf(a,anchors.filter(function(_,j){return j!==i;}));
      if(!el) return;
      var cur=items[i];
      if(cur&&cur.el===el) return;
      if(cur){cur.box.remove();}
      var box=document.createElement("div"); box.className="kh-pfx";
      box.style.setProperty("--p1",d.c[0]); box.style.setProperty("--p2",d.c[1]);
      document.body.appendChild(box);
      el.classList.add("kh-pf-target");
      items[i]={el:el,box:box};
      if(window.ResizeObserver) new ResizeObserver(sched).observe(el);
    });
  }
  function place(){
    pending=false;
    items.forEach(function(it){
      if(!it) return;
      if(!document.contains(it.el)){it.box.style.display="none"; return;}
      var r=it.el.getBoundingClientRect();
      if(r.width<20||r.height<20){it.box.style.display="none"; return;}
      var b=it.box.style;
      b.display="block"; b.left=r.left+"px"; b.top=r.top+"px"; b.width=r.width+"px"; b.height=r.height+"px";
      b.borderRadius=getComputedStyle(it.el).borderTopLeftRadius;
    });
  }
  function sched(){ if(pending) return; pending=true; requestAnimationFrame(place); }
  function run(){ try{ build(); sched(); }catch(x){} }
  new MutationObserver(run).observe(document.getElementById("root"),{childList:true,subtree:true});
  window.addEventListener("resize",sched);
  window.addEventListener("scroll",sched,true);
  run(); setTimeout(run,600); setTimeout(run,1800);
})();
</script>

      q=q.concat([].slice.call(e.children));

  function mmss(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
  function labelFor(p){

  function findBgm(){
    var l=document.querySelectorAll("label,button");
    for(var i=0;i<l.length;i++){
      var e=l[i]; if(e.closest("#kh-ld,#kh-foot,#kh-poster")) continue;
      if(/Upload BGM/i.test(e.textContent||"")) return e;
    }
    return null;
  }
  function panelOf(b){
    var p=b.closest(".kh-pf-target"); if(p) return p;
    var e=b.parentElement;
    while(e&&e!==document.body&&e.id!=="root"){
      var rad=parseFloat(getComputedStyle(e).borderTopLeftRadius)||0;
      if(rad>=8&&e.getBoundingClientRect().width<innerWidth*0.95) return e;
      e=e.parentElement;
    }
    return null;
  }
  function place(){
    if(el.style.display!=="flex") return;
    var vw=innerWidth, vh=innerHeight, b=findBgm(), r=b&&b.getBoundingClientRect(), left, top, w, h;
    if(r&&r.width>0){
      var pn=panelOf(b), pr=pn?pn.getBoundingClientRect():null;
      var limit=pr?Math.min(pr.right-16,vw-8):vw-8;
      var avail=limit-(r.right+12);
      if(avail>=150){
        el.classList.remove("above");
        el.classList.toggle("tiny",avail<190);
        w=Math.min(avail,360); el.style.width=w+"px"; h=el.offsetHeight;
        left=r.right+12; top=r.top+r.height/2-h/2;
      }else{
        el.classList.add("above"); el.classList.remove("tiny");
        var minL=pr?pr.left+16:8;
        w=Math.max(150,Math.min(260,limit-minL));
        el.classList.toggle("tiny",w<200);
        el.style.width=w+"px"; h=el.offsetHeight;
        left=limit-w;
        top=r.top-h-6;
        if(pr) top=Math.max(top,pr.top+6);
      }
    }else{
      el.classList.remove("above","tiny"); el.style.width=""; w=el.offsetWidth; h=el.offsetHeight;
      left=vw/2-w/2; top=vh-h-54;
    }
    top=Math.max(8,Math.min(top,vh-h-8));
    el.style.left=left+"px"; el.style.top=top+"px";
  }
  setInterval(place,120);
  window.addEventListener("resize",place);
})();
</script>
<script id="kh-bt-js">
(function(){
  var pf=window.fetch, cache={};
  function gOnce(t){
    return pf("https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=km&dt=t&q="+encodeURIComponent(t))
      .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
      .then(function(j){ return (j[0]||[]).map(function(x){ return x&&x[0]?x[0]:""; }).join(""); });
  }
  function gTry(t,n){
    if(!t||!t.trim()) return Promise.resolve("");
    if(cache[t]!=null) return Promise.resolve(cache[t]);
    return gOnce(t).then(function(o){ if(!o.trim()) throw new Error("empty"); cache[t]=o; return o; },
      function(e){ if(n<=0) throw e; return new Promise(function(res){ setTimeout(res,800); }).then(function(){ return gTry(t,n-1); }); });
  }
  function all(lines){
    var out=new Array(lines.length), idx=0, fail=null;
    function worker(){
      if(fail||idx>=lines.length) return Promise.resolve();
      var i=idx++;
      return gTry(lines[i],2).then(function(o){ out[i]={km:o}; },function(e){ fail=e; }).then(worker);
    }
    var ws=[]; for(var k=0;k<4;k++) ws.push(worker());
    return Promise.all(ws).then(function(){ if(fail) throw fail; return out; });
  }
  var cur=window.fetch;
  window.fetch=function(u,o){
    var url=typeof u==="string"?u:((u&&u.url)||"");
    var path=url.replace(/^https?:\/\/[^\/]+/,"").split("?")[0];
    var m=((o&&o.method)||"GET").toUpperCase();
    var p=cur.apply(this,arguments);
    if(path!=="/api/translate"||m!=="POST") return p;
    return p.then(function(r){
      if(r.ok) return r;
      return r.clone().json().then(function(j){
        var d=String((j&&j.detail)||"");
        if(d.indexOf("google_blocked")<0) return r;
        var body; try{ body=JSON.parse(o.body); }catch(e){ return r; }
        var lines=body&&body.lines; if(!Array.isArray(lines)) return r;
        if(window.khToast) window.khToast("info","Server ត្រូវ Google បិទ · កំពុងបកប្រែតាម browser របស់អ្នក ("+lines.length+" ឃ្លា)...");
        return all(lines).then(function(out){
          return new Response(JSON.stringify(out),{status:200,headers:{"Content-Type":"application/json"}});
        },function(){ return r; });
      },function(){ return r; });
    });
  };
})();
</script>
